const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let T=0,last=0,chain=Promise.resolve();
const TMO=window.RV_T||9000;
const FEAT=[
{id:21,title:'One Piece',ja:'ワンピース',score:8.7,eps:null,year:1999,genre:'Action',st:'Currently Airing',syn:'قرصان شاب اسمه لوفي يبحر مع طاقمه بحثاً عن الكنز الأعظم ليصبح ملك القراصنة.'},
{id:20,title:'Naruto',ja:'ナルト',score:8.0,eps:220,year:2002,genre:'Action',st:'Finished Airing',syn:'فتى نينجا منبوذ يحلم بأن يصبح هوكاغي قريته ويكسب اعتراف الجميع.'},
{id:269,title:'Bleach',ja:'ブリーチ',score:8.0,eps:366,year:2004,genre:'Action',st:'Finished Airing',syn:'مراهق يرى الأرواح يكتسب قوة شينيغامي ويحمي الأحياء من الأرواح الشريرة.'},
{id:40748,title:'Jujutsu Kaisen',ja:'呪術廻戦',score:8.5,eps:24,year:2020,genre:'Action',st:'Finished Airing',syn:'طالب يبتلع إصبعاً ملعوناً فيدخل عالم السحرة ويقاتل اللعنات.'},

{id:16498,title:'Attack on Titan',ja:'進撃の巨人',score:8.6,eps:25,year:2013,genre:'Action',st:'Finished Airing',syn:'البشرية محاصرة خلف الأسوار هرباً من العمالقة، وشاب يقسم على الانتقام.'},
{id:52299,title:'Solo Leveling',ja:'俺だけレベルアップな件',score:8.2,eps:12,year:2024,genre:'Action',st:'Finished Airing',syn:'أضعف صياد في العالم يحصل على قدرة فريدة تمكّنه من أن يزداد قوة بلا حدود.'},

const fromLocal=f=>({_local:1,idMal:f.id,title:{english:f.title,native:f.ja},averageScore:Math.round(f.score*10),episodes:f.eps,status:f.st=='Currently Airing'?'RELEASING':'FINISHED',seasonYear:f.year,genres:[f.genre],description:f.syn});

const errMsg=e=>e&&(e.name=='AbortError'||/timeout/.test(e.message))?'انتهت مهلة الاتصال':(e&&e.message=='Failed to fetch'?'تعذّر الاتصال بالخادم':(e&&e.message)||'خطأ غير معروف');
const cget=k=>{try{const c=JSON.parse(sessionStorage.getItem(k));if(c&&Date.now()-c.t<6e5)return c.d}catch{}},cset=(k,d)=>{try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch{}};
/* AniList GraphQL: covers, banners, details, lists, search. 9s timeout, 1 retry, cached */
async function gql(nm,q,v){const k='al:'+nm+JSON.stringify(v),c0=cget(k);if(c0)return c0;let err;
for(let i=0;i<2;i++){const c=new AbortController(),id=setTimeout(()=>c.abort(),TMO);try{const r=await fetch(AL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:q,variables:v}),signal:c.signal});
if(r.status==429){err=new Error('HTTP 429');await sleep(Math.min(3,+r.headers.get('Retry-After')||2)*1000);continue}
const j=await r.json().catch(()=>null);if(r.status>=500){err=new Error('HTTP '+r.status);await sleep(600);continue}
if(!r.ok||(j&&j.errors&&!j.data)){const e=new Error(r.status==404?'غير موجود في AniList':(j&&j.errors&&j.errors[0].message)||'HTTP '+r.status);e.fatal=1;throw e}
cset(k,j);return j}catch(e){if(e.fatal)throw e;err=e.name=='AbortError'?new Error('timeout'):e}finally{clearTimeout(id)}}throw err}
const MF='idMal id title{romaji english native} coverImage{extraLarge large} bannerImage averageScore episodes status seasonYear startDate{year} genres format description(asHtml:false)';
const PAGEQ=`query($p:Int,$pp:Int,$ids:[Int],$sort:[MediaSort],$q:String,$g:String,$season:MediaSeason,$y:Int,$st:MediaStatus,$stn:MediaStatus){Page(page:$p,perPage:$pp){pageInfo{hasNextPage}media(type:ANIME,isAdult:false,idMal_in:$ids,sort:$sort,search:$q,genre:$g,season:$season,seasonYear:$y,status:$st,status_not:$stn){${MF}}}}`;
const DETQ=`query($id:Int){Media(idMal:$id,type:ANIME){${MF} relations{edges{relationType node{idMal type format title{romaji english}}}} recommendations(sort:RATING_DESC,perPage:12){nodes{mediaRecommendation{idMal title{romaji english native} coverImage{extraLarge large} averageScore seasonYear startDate{year} genres status}}}}}`;
const RELQ=`query($id:Int){Media(idMal:$id,type:ANIME){relations{edges{relationType node{idMal type format title{romaji english}}}}}}`;
const aniPage=async v=>{const j=await gql('pg',PAGEQ,{p:1,pp:24,...v}),pg=j.data.Page;let it=pg.media.filter(m=>m.idMal);if(v.ids)it=v.ids.map(i=>it.find(m=>m.idMal==i)).filter(Boolean);return{items:it,hasNext:!!pg.pageInfo.hasNextPage}};
/* Jikan: episodes only. serialized (<3 req/s), 12s timeout, 1 retry; stale requests are skipped WITHOUT blocking the queue */
async function fx(p){const c=new AbortController(),id=setTimeout(()=>c.abort(),TMO+3000);try{const r=await fetch(API+p,{signal:c.signal});if(r.status==429||r.status>=500){const e=new Error('HTTP '+r.status);e.retry=1;throw e}if(!r.ok){const e=new Error('HTTP '+r.status);e.fatal=1;throw e}return await r.json()}catch(e){if(!e.fatal)e.retry=1;if(e.name=='AbortError')e.message='timeout';throw e}finally{clearTimeout(id)}}
function api(p){const k='rv:'+p,tk=T,c0=cget(k);if(c0)return Promise.resolve(c0);

const pr=chain.then(run,run);chain=pr.catch(()=>{});return pr.catch(e=>e.stale?new Promise(()=>{}):Promise.reject(e))}
